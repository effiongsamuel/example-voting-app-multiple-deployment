---
# Installs the k3s control plane. Traefik and servicelb are not needed (the
# load balancer in front of the servers uses NodePorts), so they are switched off
# to save memory.
- name: k3s server | download the installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: k3s server | install
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_EXEC: "server --tls-san {{ k3s_server_ip }} --node-label tier={{ tier }} --disable traefik --disable servicelb --write-kubeconfig-mode 644"

- name: k3s server | wait for the Kubernetes API
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_api
  until: k3s_api.rc == 0
  retries: 30
  delay: 5
  changed_when: false
