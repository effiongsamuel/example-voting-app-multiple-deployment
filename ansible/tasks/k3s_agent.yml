---
# Joins this server to the k3s control plane. The node gets the label
# tier=<its tier>, which the manifests use to pin pods to the right servers.
- name: k3s agent | download the installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: k3s agent | wait until the control plane answers on port 6443
  ansible.builtin.wait_for:
    host: "{{ k3s_server_ip }}"
    port: 6443
    timeout: 300

- name: k3s agent | install the service (files only, do not start yet)
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /etc/systemd/system/k3s-agent.service
  environment:
    K3S_URL: "https://{{ k3s_server_ip }}:6443"
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_EXEC: "agent --node-label tier={{ tier }}"
    INSTALL_K3S_SKIP_START: "true"

# The service waits until it has joined the cluster, so start it without blocking.
- name: k3s agent | start
  ansible.builtin.command: systemctl enable --now --no-block k3s-agent
  changed_when: false

- name: k3s agent | wait until it is active (max 6 minutes)
  ansible.builtin.command: systemctl is-active k3s-agent
  register: agent_state
  until: agent_state.stdout == "active"
  retries: 36
  delay: 10
  failed_when: false
  changed_when: false

- name: k3s agent | stop here if it did not join
  ansible.builtin.assert:
    that: agent_state.stdout == "active"
    fail_msg: "k3s-agent on {{ inventory_hostname }} is '{{ agent_state.stdout }}', not active"
