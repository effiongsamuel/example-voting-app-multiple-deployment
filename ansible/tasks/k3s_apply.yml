---
# Runs on the control plane. Applies the manifests from k8s-specifications/
# unchanged, plus an overlay (templates/kustomization.yaml.j2) that pins every
# deployment to the servers of its tier.
- name: k3s apply | wait until every server is a Ready node
  ansible.builtin.shell: k3s kubectl get nodes --no-headers | grep -c ' Ready'
  register: nodes_ready
  until: (nodes_ready.stdout | int) >= (groups['all'] | length)
  retries: 60
  delay: 10
  failed_when: false
  changed_when: false

- name: k3s apply | create the manifest folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/voting-app/k8s
    - /opt/voting-app/k8s/base

- name: k3s apply | copy k8s-specifications (the base, unchanged)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s-specifications/"
    dest: /opt/voting-app/k8s/base/
    mode: "0644"

- name: k3s apply | write the overlay that pins pods to their tier
  ansible.builtin.template:
    src: kustomization.yaml.j2
    dest: /opt/voting-app/k8s/kustomization.yaml
    mode: "0644"

- name: k3s apply | apply
  ansible.builtin.command: k3s kubectl apply -k /opt/voting-app/k8s
  register: k8s_apply
  changed_when: "'created' in k8s_apply.stdout or 'configured' in k8s_apply.stdout"

- name: k3s apply | wait for every deployment to roll out
  ansible.builtin.command: "k3s kubectl rollout status deployment/{{ item }} --timeout=300s"
  loop: [db, redis, worker, vote, result]
  changed_when: false

- name: k3s apply | wait for the vote page (NodePort)
  ansible.builtin.uri:
    url: "http://{{ k3s_server_ip }}:{{ k3s_vote_nodeport }}/"
    status_code: 200
  register: k3s_vote_up
  until: k3s_vote_up.status == 200
  retries: 30
  delay: 10

- name: k3s apply | wait for the result page (NodePort)
  ansible.builtin.uri:
    url: "http://{{ k3s_server_ip }}:{{ k3s_result_nodeport }}/"
    status_code: 200
  register: k3s_result_up
  until: k3s_result_up.status == 200
  retries: 30
  delay: 10

- name: k3s apply | show nodes and pods
  ansible.builtin.shell: k3s kubectl get nodes -L tier && k3s kubectl get pods -o wide
  register: k8s_overview
  changed_when: false

- name: k3s apply | result
  ansible.builtin.debug:
    var: k8s_overview.stdout_lines
