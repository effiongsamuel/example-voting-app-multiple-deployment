---
# Installs single-node k3s and applies the manifests from k8s-specifications/.
- name: k3s | download the installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: k3s | install the server
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_EXEC: "server --tls-san {{ public_ip }} --write-kubeconfig-mode 644"

- name: k3s | wait until the node is Ready
  ansible.builtin.shell: k3s kubectl get nodes --no-headers | grep -c ' Ready'
  register: node_ready
  until: (node_ready.stdout | int) >= 1
  retries: 60
  delay: 5
  failed_when: false
  changed_when: false

- name: k3s | create the manifest folder
  ansible.builtin.file:
    path: /opt/voting-app
    state: directory
    mode: "0755"

- name: k3s | copy k8s-specifications to the server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s-specifications/"
    dest: /opt/voting-app/k8s-specifications/
    mode: "0644"

- name: k3s | apply the manifests
  ansible.builtin.command: k3s kubectl apply -f /opt/voting-app/k8s-specifications/
  register: k8s_apply
  changed_when: "'created' in k8s_apply.stdout or 'configured' in k8s_apply.stdout"

- name: k3s | wait for every deployment to roll out
  ansible.builtin.command: "k3s kubectl rollout status deployment/{{ item }} --timeout=300s"
  loop: [db, redis, vote, result, worker]
  changed_when: false

- name: k3s | wait for the vote page (NodePort)
  ansible.builtin.uri:
    url: "http://{{ private_ip }}:{{ k3s_vote_nodeport }}/"
    status_code: 200
  register: k3s_vote_up
  until: k3s_vote_up.status == 200
  retries: 30
  delay: 10

- name: k3s | wait for the result page (NodePort)
  ansible.builtin.uri:
    url: "http://{{ private_ip }}:{{ k3s_result_nodeport }}/"
    status_code: 200
  register: k3s_result_up
  until: k3s_result_up.status == 200
  retries: 30
  delay: 10

- name: k3s | show the pods
  ansible.builtin.command: k3s kubectl get pods -o wide
  register: k8s_pods
  changed_when: false

- name: k3s | result
  ansible.builtin.debug:
    var: k8s_pods.stdout_lines
