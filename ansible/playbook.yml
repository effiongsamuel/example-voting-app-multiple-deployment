---
# Run automatically by Terraform (terraform/ansible.tf), or by hand from this folder:
#   ansible-playbook playbook.yml -e @vars.generated.yml
# Safe to re-run. deploy_method (from Terraform) is compose, k3s or both:
#   compose  one Docker container per server; the "tier" variable (set in the
#            inventory) decides which one
#   k3s      one k3s cluster over the same servers, the Helm chart in helm/voting-app/ applied
#            with every pod pinned to the server of its tier

# 1. Every server: wait for SSH, install Docker -----------------------------------
- name: Prepare every server
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait until SSH works (new servers need a minute or two)
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 900

    - name: Gather facts
      ansible.builtin.setup:

    - name: Wait for first-boot cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Install Docker, the compose plugin and tools
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, curl, ca-certificates]
        update_cache: true
        lock_timeout: 300

    - name: Start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Let the ssh user run docker without sudo
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

# 1b. Stop early, with a clear message, if the images cannot be pulled ------------
- name: Check that the application images can be pulled
  hosts: k3s_server
  become: true
  gather_facts: false
  tasks:
    - name: Try to pull each image
      ansible.builtin.command: "docker pull {{ item }}"
      loop:
        - "{{ vote_image }}"
        - "{{ result_image }}"
        - "{{ worker_image }}"
      register: image_pull
      failed_when: false
      changed_when: false

    - name: Stop with an explanation if an image cannot be pulled
      ansible.builtin.fail:
        msg: >-
          Cannot pull: {{ image_pull.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}.
          "denied" means the image does not exist yet or the package is private. Fix: (1) push a change in
          vote/, result/ or worker/ to main and wait until the CI-CD workflow is green, (2) on GitHub open
          Your profile > Packages, and set each example-voting-app-5tier-* package to Public, (3) check that
          github_owner in terraform/terraform.tfvars is your GitHub name (the name must match the package
          path above), then run this workflow again.
      when: (image_pull.results | selectattr('rc', 'ne', 0) | list | length) > 0

# 2. Docker Compose first, so Docker's networks exist before k3s starts -------------
- name: Compose | data tier (redis and postgres)
  hosts: redis:postgres
  become: true
  gather_facts: false
  tasks:
    - name: Deploy this tier
      ansible.builtin.include_tasks: tasks/deploy_tier.yml
      when: deploy_method in ['compose', 'both']

- name: Compose | application tier (worker)
  hosts: worker
  become: true
  gather_facts: false
  tasks:
    - name: Deploy this tier
      ansible.builtin.include_tasks: tasks/deploy_tier.yml
      when: deploy_method in ['compose', 'both']

- name: Compose | web tier (vote and result)
  hosts: vote:result
  become: true
  gather_facts: false
  tasks:
    - name: Deploy this tier
      ansible.builtin.include_tasks: tasks/deploy_tier.yml
      when: deploy_method in ['compose', 'both']

# 3. k3s: control plane, then agents, then the app -------------------------------------
- name: k3s | control plane
  hosts: k3s_server
  become: true
  gather_facts: false
  tasks:
    - name: Install the k3s server
      ansible.builtin.include_tasks: tasks/k3s_server.yml
      when: deploy_method in ['k3s', 'both']

- name: k3s | agents (every other server)
  hosts: k3s_agents
  become: true
  gather_facts: false
  tasks:
    - name: Join the cluster
      ansible.builtin.include_tasks: tasks/k3s_agent.yml
      when: deploy_method in ['k3s', 'both']

- name: k3s | deploy the app
  hosts: k3s_server
  become: true
  gather_facts: false
  tasks:
    - name: Install the Helm chart with one pod per tier server
      ansible.builtin.include_tasks: tasks/k3s_apply.yml
      when: deploy_method in ['k3s', 'both']

# 4. End-to-end check through the load balancer ---------------------------------------
- name: Check the load balancer
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Compose | wait for the vote page (new load balancers need a few minutes)
      ansible.builtin.uri:
        url: "http://{{ alb_dns }}/"
        status_code: 200
      register: lb_vote
      until: lb_vote.status == 200
      retries: 40
      delay: 15
      when: deploy_method in ['compose', 'both']

    - name: Compose | wait for the result page
      ansible.builtin.uri:
        url: "http://{{ alb_dns }}:{{ result_listener_port }}/"
        status_code: 200
      register: lb_result
      until: lb_result.status == 200
      retries: 40
      delay: 15
      when: deploy_method in ['compose', 'both']

    - name: k3s | wait for the vote page
      ansible.builtin.uri:
        url: "http://{{ alb_dns }}:{{ k3s_vote_nodeport }}/"
        status_code: 200
      register: lb_k3s_vote
      until: lb_k3s_vote.status == 200
      retries: 40
      delay: 15
      when: deploy_method in ['k3s', 'both']

    - name: k3s | wait for the result page
      ansible.builtin.uri:
        url: "http://{{ alb_dns }}:{{ k3s_result_nodeport }}/"
        status_code: 200
      register: lb_k3s_result
      until: lb_k3s_result.status == 200
      retries: 40
      delay: 15
      when: deploy_method in ['k3s', 'both']

    - name: Docker Compose URLs
      ansible.builtin.debug:
        msg:
          - "Vote:   http://{{ alb_dns }}"
          - "Result: http://{{ alb_dns }}:{{ result_listener_port }}"
      when: deploy_method in ['compose', 'both']

    - name: k3s URLs
      ansible.builtin.debug:
        msg:
          - "Vote (k3s):   http://{{ alb_dns }}:{{ k3s_vote_nodeport }}"
          - "Result (k3s): http://{{ alb_dns }}:{{ k3s_result_nodeport }}"
      when: deploy_method in ['k3s', 'both']

    - name: k3s | wait for Grafana (monitoring, not essential for the app)
      ansible.builtin.uri:
        url: "http://{{ alb_dns }}:{{ grafana_nodeport }}/api/health"
        status_code: 200
      register: lb_grafana
      until: lb_grafana.status == 200
      retries: 20
      delay: 15
      failed_when: false
      when: deploy_method in ['k3s', 'both']

    - name: k3s | Grafana URL
      ansible.builtin.debug:
        msg:
          - "Grafana (k3s): http://{{ alb_dns }}:{{ grafana_nodeport }}   user: admin   ({{ 'answers' if (lb_grafana.status | default(0)) == 200 else 'did not answer yet, see instruction.txt PART 9' }})"
      when: deploy_method in ['k3s', 'both']
